<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>上傳照片｜FOR US 限定拍貼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --coffee-dark:#548699;
    --ink:#1E3A4C;
    --cream:#dcf3fc;
    --mustard:#69a1b8;
    --sage:#548699;
    --sage-soft:#D6E8F0;
    --line:rgba(30,58,76,0.16);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100dvh;
    background:var(--cream);
    font-family:'Noto Sans TC', sans-serif;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:20px;
    padding:28px 22px 24px;
    box-shadow:0 12px 30px rgba(30,58,76,0.12);
    text-align:center;
  }
  h1{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:22px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .desc{
    font-size:13.5px;
    color:var(--coffee-dark);
    margin:0 0 20px;
    line-height:1.6;
  }
  .progress{
    font-size:14px;
    font-weight:700;
    color:var(--ink);
    margin-bottom:14px;
  }
  .dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:20px;
    flex-wrap:wrap;
  }
  .dot{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--sage);
    background:transparent;
  }
  .dot.done{ background:var(--sage); }
  .thumbs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
    margin-bottom:20px;
  }
  .thumb{
    width:64px;height:64px;
    border-radius:10px;
    background-size:cover;
    background-position:center;
    border:1px solid var(--line);
  }
  label.upload-btn{
    display:block;
    width:100%;
    padding:14px;
    border-radius:14px;
    background:var(--coffee-dark);
    color:#fff;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    border:none;
  }
  label.upload-btn.disabled{
    background:#b9c9d0;
    pointer-events:none;
  }
  input[type=file]{ display:none; }
  .status{
    margin-top:14px;
    font-size:13px;
    color:var(--coffee-dark);
    min-height:18px;
  }
  .status.error{ color:#c0392b; }
  .done-icon{
    font-size:40px;
    margin-bottom:8px;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="done-icon" id="doneIcon" style="display:none;">🎉</div>
    <h1 id="titleText">用手機上傳照片</h1>
    <p class="desc" id="descText">選好的照片會直接送到現場那台裝置，用來合成拍貼。</p>
    <div class="progress" id="progressText"></div>
    <div class="dots" id="dots"></div>
    <div class="thumbs" id="thumbs"></div>
    <label class="upload-btn" id="uploadLabel" for="fileInput">選擇照片</label>
    <input type="file" id="fileInput" accept="image/*" multiple>
    <div class="status" id="statusText"></div>
  </div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script>
(function(){
  const firebaseConfig = {
    apiKey: "AIzaSyCm5OU5CvdqIgsW4d6W2b9EnIqZt5Apz0g",
    authDomain: "forus-photobooth.firebaseapp.com",
    databaseURL: "https://forus-photobooth-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "forus-photobooth",
    storageBucket: "forus-photobooth.firebasestorage.app",
    messagingSenderId: "689429328187",
    appId: "1:689429328187:web:e146f57103842aa997871e",
    measurementId: "G-8D3SJGW1FF"
  };
  firebase.initializeApp(firebaseConfig);
  const storage = firebase.storage();
  const db = firebase.database();

  const params = new URLSearchParams(location.search);
  const sessionId = params.get('session');
  const needed = Math.max(1, parseInt(params.get('count') || '4', 10));

  const titleText = document.getElementById('titleText');
  const descText = document.getElementById('descText');
  const progressText = document.getElementById('progressText');
  const dotsEl = document.getElementById('dots');
  const thumbsEl = document.getElementById('thumbs');
  const uploadLabel = document.getElementById('uploadLabel');
  const fileInput = document.getElementById('fileInput');
  const statusText = document.getElementById('statusText');
  const doneIcon = document.getElementById('doneIcon');

  if(!sessionId){
    titleText.textContent = '連結有誤';
    descText.textContent = '找不到場次代碼，請回到現場重新掃描 QR Code。';
    uploadLabel.classList.add('disabled');
    return;
  }

  let uploadedCount = 0;

  function renderDots(){
    dotsEl.innerHTML = '';
    for(let i=0;i<needed;i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i < uploadedCount ? ' done' : '');
      dotsEl.appendChild(d);
    }
    progressText.textContent = `已上傳 ${uploadedCount} / ${needed} 張`;
  }

  function addThumb(src){
    const t = document.createElement('div');
    t.className = 'thumb';
    t.style.backgroundImage = `url(${src})`;
    thumbsEl.appendChild(t);
  }

  function finishIfComplete(){
    if(uploadedCount >= needed){
      titleText.textContent = '上傳完成！';
      descText.textContent = '請回到現場螢幕，照片已經自動送過去合成囉。';
      doneIcon.style.display = 'block';
      uploadLabel.classList.add('disabled');
      statusText.textContent = '';
    }
  }

  // 先讀一次現有進度，避免重新整理後重複上傳滿額
  db.ref('sessions/' + sessionId + '/photos').get().then(snap=>{
    const data = snap.val() || {};
    uploadedCount = Object.keys(data).length;
    renderDots();
    finishIfComplete();
  }).catch(()=>{ renderDots(); });

  renderDots();

  fileInput.addEventListener('change', async ()=>{
    const remaining = needed - uploadedCount;
    if(remaining <= 0) return;
    const files = Array.from(fileInput.files).slice(0, remaining);
    if(files.length === 0) return;

    uploadLabel.classList.add('disabled');
    for(const file of files){
      const index = uploadedCount; // 上傳前先取號，確保順序不重複
      uploadedCount++;
      renderDots();
      statusText.textContent = `第 ${index + 1} 張上傳中…`;
      statusText.classList.remove('error');
      try{
        const localUrl = URL.createObjectURL(file);
        addThumb(localUrl);
        const storageRef = storage.ref().child(`sessions/${sessionId}/${index}.jpg`);
        await storageRef.put(file, { contentType: file.type || 'image/jpeg' });
        const url = await storageRef.getDownloadURL();
        await db.ref(`sessions/${sessionId}/photos/${index}`).set(url);
      }catch(err){
        statusText.textContent = '上傳失敗，請重新選擇這張照片：' + err.message;
        statusText.classList.add('error');
        uploadedCount--; // 失敗就把號碼還回去，讓使用者可以重試
        renderDots();
        uploadLabel.classList.remove('disabled');
        fileInput.value = '';
        return;
      }
    }
    statusText.textContent = '';
    fileInput.value = '';
    renderDots();
    finishIfComplete();
    if(uploadedCount < needed){
      uploadLabel.classList.remove('disabled');
    }
  });
})();
</script>
</body>
</html>
