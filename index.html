    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Noto Sans TC', sans-serif;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(8px,1.6dvh,28px) 16px;
    overflow-y:auto;
  }
  .app{
    width:100%;
    max-width:460px;
    max-height:100%;
    transition:max-width .2s ease;
  }
  .app.stage-capture{
    max-width:560px;
  }
  @media (min-width:900px) and (min-height:760px){
    .app.stage-capture{ max-width:760px; }
  }
  header.top{
    text-align:center;
    margin-bottom:clamp(6px,1.6dvh,22px);
  }
  header.top .mark{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(20px,3.2dvh,34px);
    letter-spacing:0.04em;
    color:var(--coffee-dark);
  }
  header.top .sub{
    margin-top:4px;
    font-size:clamp(10px,1.5dvh,13.5px);
    color:var(--coffee-dark);
    opacity:0.62;
  }
  .card{
    background:var(--cream-soft);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:clamp(12px,2.2dvh,22px);
    box-shadow:0 1px 0 rgba(58,42,30,0.05);
  }
  .step-label{
    font-size:clamp(11px,1.3dvh,13px);
    color:var(--mustard);
    font-weight:700;
    margin-bottom:clamp(3px,0.6dvh,6px);
  }
  h1.title{
    font-family:'Noto Serif TC', serif;
    font-size:clamp(16px,2.6dvh,22px);
    font-weight:700;
    margin:0 0 6px;
    color:var(--coffee-dark);
    line-height:1.3;
  }
  p.desc{
    margin:0 0 clamp(8px,1.6dvh,18px);
    font-size:clamp(12px,1.5dvh,14px);
    line-height:1.5;
    color:var(--ink);
    opacity:0.75;
  }
  label.field-label{
    display:block;
    font-size:12.5px;
    font-weight:500;
    margin-bottom:5px;
    color:var(--coffee-dark);
  }
  input.name-input{
    width:100%;
    padding:clamp(7px,1.3dvh,11px) 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:#fff;
    font-family:'Noto Sans TC', sans-serif;
    font-size:14px;
    color:var(--ink);
    margin-bottom:clamp(10px,1.6dvh,20px);
  }
  input.name-input:focus{outline:2px solid var(--mustard); outline-offset:1px;}

  .frames{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-bottom:clamp(10px,1.8dvh,22px);
  }
  .frame-choice{
    cursor:pointer;
    border:2px solid transparent;
    border-radius:12px;
    padding:6px 6px 8px;
    text-align:center;
    background:#fff;
    transition:border-color .15s ease, transform .15s ease;
  }
  .frame-choice:hover{transform:translateY(-1px);}
  .frame-choice.active{border-color:var(--mustard); background:var(--cream);}
  .frame-choice .swatch{
    width:100%;
    height:clamp(34px,6dvh,64px);
    border-radius:8px;
    margin-bottom:6px;
  }
  .swatch.theme-drip{background: url('image/LOGO1.jpg') center/cover; border:2px solid var(--coffee-dark);}
  .swatch.theme-forest{background: url('image/LOGO1.jpg') center/cover; border:2px dashed var(--sage);}
  .swatch.theme-retro{background: url('image/LOGO3.jpg') center/cover; border:2px solid var(--sage);}
  .swatch.theme-layover{background: url('image/LOGO2.jpg') center/cover; border:2px solid var(--sage);}
  .swatch.theme-taetae{background:linear-gradient(160deg,#FBE4E4,#fff); border:2px solid #C2555A;}
  .swatch.theme-tantan{background:linear-gradient(160deg,#DCEFFC,#fff); border:2px dotted #3E7CA6;}
  .frame-choice .fname{font-size:12px; font-weight:500; color:var(--coffee-dark);}

  .layout-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:clamp(10px,1.6dvh,20px);
  }
  .layout-toggle.cols-3{
    grid-template-columns:1fr 1fr 1fr;
    gap:6px;
  }
  .layout-toggle.cols-3 .lname{font-size:11.5px; line-height:1.3;}
  .layout-btn{
    cursor:pointer;
    border:2px solid transparent;
    border-radius:12px;
    padding:clamp(6px,1.2dvh,12px) 6px;
    text-align:center;
    background:#fff;
    font-family:'Noto Sans TC', sans-serif;
    transition:border-color .15s ease;
  }
  .layout-btn.active{border-color:var(--mustard); background:var(--cream);}
  .layout-icon{

    margin-top:clamp(6px,1dvh,10px);
  }

  /* capture screen */
  .viewfinder-wrap{
    position:relative;
    border-radius:14px;
    overflow:hidden;
    background:#000;
    aspect-ratio:3/4;
    width:100%;
    max-height:38dvh;
    margin:0 auto clamp(8px,1.5dvh,16px);
    transition:aspect-ratio .2s ease;
  }
  video{width:100%; height:100%; object-fit:cover; transform:scaleX(-1); display:block;}
  .countdown-overlay{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .countdown-num{
    font-family:'Noto Serif TC', serif;
    font-weight:900;
    font-size:clamp(88px, 14vw, 200px);
    color:#fff;
    text-shadow:0 2px 18px rgba(0,0,0,0.5);
    animation:pop .5s ease;
  }
  @keyframes pop{from{transform:scale(0.6); opacity:0;} to{transform:scale(1); opacity:1;}}
  .shot-indicator{
    position:absolute; top:12px; left:12px;
    display:flex; gap:6px;
  }
  .shot-dot{width:9px; height:9px; border-radius:50%; background:rgba(255,255,255,0.35);}
  .shot-dot.done{background:var(--mustard);}
  .snap-flash{
    position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none;
  }
  .snap-flash.flash{animation:flash .35s ease;}
  @keyframes flash{0%{opacity:0.9;} 100%{opacity:0;}}
  .cam-status{
    font-size:12.5px; text-align:center; color:var(--coffee-dark); opacity:0.7; margin-bottom:clamp(6px,1.2dvh,14px); min-height:16px;
  }
  .thumbs-row{
    display:flex; gap:6px; margin-bottom:clamp(6px,1.2dvh,16px);

  .thumbs-row .thumb{
    flex:1; aspect-ratio:4/3; max-height:70px; border-radius:8px; background:#eee0c8; border:1px solid var(--line);
    background-size:cover; background-position:center;

  /* result */
  .result-canvas-wrap{

  #resultCanvas{

  .qr-panel{
    position:fixed; inset:0;
    background:rgba(43,31,22,0.55);
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    z-index:50;

  .qr-panel-inner{
    background:var(--cream-soft);
    border-radius:var(--radius);

  .qr-title{
    font-family:'Noto Serif TC', serif;
    font-weight:700;
    font-size:18px;
    color:var(--coffee-dark);
    margin-bottom:14px;

  .qr-img{

</style>

<script>
(function(){
  const screenSelect = document.getElementById('screenSelect');
  const screenCapture = document.getElementById('screenCapture');
  const screenResult = document.getElementById('screenResult');
  const appEl = document.querySelector('.app');
  const startBtn = document.getElementById('startBtn');
  const captureBtn = document.getElementById('captureBtn');
  const backToSelectBtn = document.getElementById('backToSelectBtn');
  const uploadQrPanel = document.getElementById('uploadQrPanel');
  const uploadQrImg = document.getElementById('uploadQrImg');
  const uploadQrStatus = document.getElementById('uploadQrStatus');
  const uploadQrCancelBtn = document.getElementById('uploadQrCancelBtn');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const qrBtn = document.getElementById('qrBtn');
  const qrPanel = document.getElementById('qrPanel');
  const qrImg = document.getElementById('qrImg');
  const qrStatus = document.getElementById('qrStatus');
  const qrCloseBtn = document.getElementById('qrCloseBtn');
  const confirmPanel = document.getElementById('confirmPanel');
  const confirmRetakeBtn = document.getElementById('confirmRetakeBtn');
  const cancelRetakeBtn = document.getElementById('cancelRetakeBtn');
  const video = document.getElementById('video');
  const flash = document.getElementById('flash');
  const camStatus = document.getElementById('camStatus');
  const countdownOverlay = document.getElementById('countdownOverlay');
  const shotIndicator = document.getElementById('shotIndicator');
  const thumbsRow = document.getElementById('thumbsRow');
  const resultCanvas = document.getElementById('resultCanvas');
  const shopNameInput = document.getElementById('shopNameInput');
  const frameGrid = document.getElementById('frameGrid');
  const sourceToggle = document.getElementById('sourceToggle');
  const viewfinderWrap = document.getElementById('viewfinderWrap');

  let selectedTheme = 'drip';
  let selectedLayout = 'strip4x6'; // 'strip4x6' | 'a4poster' | 'single'
  let selectedSource = 'camera'; // 'camera' or 'upload'
  let stream = null;
  window.addEventListener('beforeunload', stopCamera);
  let capturedImages = []; // Image objects
  const layoutToggle = document.getElementById('layoutToggle');

  // LAYOVER 主題：直接使用實際相框圖檔（透明窗格 + 版面 + LOGO 一次到位）
  let layoverFrameImg_strip4x6 = new Image();
  let layoverFrameReady_strip4x6 = false;
  layoverFrameImg_strip4x6.onload = ()=>{ layoverFrameReady_strip4x6 = true; composeResult(); };
  layoverFrameImg_strip4x6.src = 'image/IMG_0087.PNG';

  let layoverFrameImg_a4poster = new Image();
  let layoverFrameReady_a4poster = false;
  layoverFrameImg_a4poster.onload = ()=>{ layoverFrameReady_a4poster = true; composeResult(); };
  layoverFrameImg_a4poster.src = 'image/IMG_0086.png';

  let layoverFrameImg_single = new Image();
  let layoverFrameReady_single = false;
  layoverFrameImg_single.onload = ()=>{ layoverFrameReady_single = true; composeResult(); };
  layoverFrameImg_single.src = 'image/IMG_0085.png';

  // 相框圖檔中透明窗格的實際座標（1200×1800 畫布）
  const LAYOVER_CELLS = [
    {x:40,  y:40,  w:548, h:729},
    {x:612, y:40,  w:548, h:729},
    {x:40,  y:791, w:548, h:729},
    {x:612, y:791, w:548, h:729}
  ];

    // 2.0 主題：三種尺寸各自的相框圖檔（透明窗格露出照片）
  let retroFrameImg_strip4x6 = new Image();
  let retroFrameReady_strip4x6 = false;
  retroFrameImg_strip4x6.onload = ()=>{ retroFrameReady_strip4x6 = true; composeResult(); };
  retroFrameImg_strip4x6.src = 'image/IMG_0088.PNG';

  let retroFrameImg_a4poster = new Image();
  let retroFrameReady_a4poster = false;
  retroFrameImg_a4poster.onload = ()=>{ retroFrameReady_a4poster = true; composeResult(); };
  retroFrameImg_a4poster.src = 'image/IMG_0089.png';

  let retroFrameImg_single = new Image();
  let retroFrameReady_single = false;
  retroFrameImg_single.onload = ()=>{ retroFrameReady_single = true; composeResult(); };
  retroFrameImg_single.src = 'image/IMG_0090.png';

  function shotsNeeded(){ return selectedLayout === 'single' ? 1 : 4; }

  // 對應 composeResult() 中各尺寸的單格照片寬高比，讓取景框跟著拍攝尺寸變化
  function getCellAspect(layout){
    if(layout === 'a4poster'){
      const cellW = 1000 - 45*2;
      const cellH = Math.round(cellW * 0.66);
      return cellW / cellH;
    } else if(layout === 'single'){
      const cellW = 1200 - 40*2;
      const cellH = Math.round(cellW * 4/3);
      return cellW / cellH;
    } else {
      const cellW = (1200 - 40*2 - 20) / 2;
      const cellH = (1800 - 40*2 - 20 - 240) / 2;
      return cellW / cellH;
    }
  }

  function applyViewfinderAspect(){
    viewfinderWrap.style.aspectRatio = getCellAspect(selectedLayout);
  }

  frameGrid.addEventListener('click', (e)=>{
    const el = e.target.closest('.frame-choice');
    if(!el) return;
    document.querySelectorAll('.frame-choice').forEach(f=>f.classList.remove('active'));
    el.classList.add('active');
    selectedTheme = el.dataset.theme;
  });

  layoutToggle.addEventListener('click', (e)=>{
    const el = e.target.closest('.layout-btn');
    if(!el) return;
    layoutToggle.querySelectorAll('.layout-btn').forEach(f=>f.classList.remove('active'));
    el.classList.add('active');
    selectedLayout = el.dataset.layout;
    applyViewfinderAspect();
  });

  sourceToggle.addEventListener('click', (e)=>{
    const el = e.target.closest('.layout-btn');
    if(!el) return;
    sourceToggle.querySelectorAll('.layout-btn').forEach(f=>f.classList.remove('active'));
    el.classList.add('active');
    selectedSource = el.dataset.source;
    applySourceUI();
  });

  startBtn.addEventListener('click', ()=>{
    screenSelect.classList.add('hidden');
    screenCapture.classList.remove('hidden');
    appEl.classList.add('stage-capture');
    applyViewfinderAspect();
    resetCapture();
  });

  backToSelectBtn.addEventListener('click', ()=>{
    resetCapture();
    screenCapture.classList.add('hidden');
    screenSelect.classList.remove('hidden');
    appEl.classList.remove('stage-capture');
  });

  function resetCapture(){
    capturedImages = [];
    thumbsRow.innerHTML = '';
    updateShotDots();
    captureBtn.disabled = false;
    cancelPhoneUpload();
    applySourceUI();
  }

  function applySourceUI(){
    if(selectedSource === 'upload'){
      stopCamera();
      viewfinderWrap.classList.add('hidden');
      camStatus.textContent = '請用手機掃描 QR Code 上傳照片';
      captureBtn.textContent = shotsNeeded() === 1 ? '產生上傳 QR Code（1 張）' : `產生上傳 QR Code（${shotsNeeded()} 張）`;
    } else {
      viewfinderWrap.classList.remove('hidden');
      if(stream){
        video.srcObject = stream;
        video.play && video.play().catch(()=>{});
        camStatus.textContent = '準備好了就拍照吧';
        captureBtn.textContent = shotsNeeded() === 1 ? '拍照（單張）' : `拍照（連拍 ${shotsNeeded()} 張）`;
      } else {
        camStatus.textContent = '按下方按鈕開啟鏡頭';
        captureBtn.textContent = '開啟鏡頭';
      }
    }
  }

  function stopCamera(){
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }

  async function startCamera(){
    try{
      camStatus.textContent = '請允許使用相機權限…';
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'user', width:{ideal:960}, height:{ideal:720} }, audio:false });
      video.srcObject = stream;
      camStatus.textContent = '準備好了就拍照吧';
      captureBtn.textContent = shotsNeeded() === 1 ? '拍照（單張）' : `拍照（連拍 ${shotsNeeded()} 張）`;
    }catch(err){
      camStatus.textContent = '無法使用相機，改用手機掃碼上傳吧';
      selectedSource = 'upload';
      sourceToggle.querySelectorAll('.layout-btn').forEach(f=>f.classList.toggle('active', f.dataset.source === 'upload'));
      applySourceUI();
    }
  }

  // ---- 手機掃碼上傳照片 ----
  // 「照片來源」選手機掃碼上傳時，按下按鈕不是打開本機檔案總管，而是：
  //   1. 產生一組隨機場次代碼 sessionId
  //   2. 把「mobile-upload.html?session=xxx&count=N」做成 QR Code 給粉絲掃
  //   3. 粉絲在自己手機上選照片、直接上傳到 Firebase（Storage + Realtime Database）
  //   4. 這台裝置監聽 Realtime Database，照片一到齊就自動抓下來合成
  // 上傳/監聽都需要先完成第一次對話裡提到的 Firebase Storage 規則設定，
  // 另外 Realtime Database 也要記得到 Firebase Console → Realtime Database → Rules
  // 開放讀寫（一樣建議僅限活動期間開放，之後改回需要驗證）：
  //   { "rules": { ".read": true, ".write": true } }
  let uploadSession = null; // { id, ref }
  let loadingUploadedPhotos = false;

  function randomSessionId(){
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function buildMobileUploadUrl(sessionId, count){
    const base = location.href.replace(/[^/]*$/, ''); // 目前這頁所在的資料夾
    return `${base}mobile-upload.html?session=${sessionId}&count=${count}`;
  }

  function cancelPhoneUpload(){
    if(uploadSession && uploadSession.ref){
      uploadSession.ref.off();
    }
    uploadSession = null;
    uploadQrPanel.classList.add('hidden');
    uploadQrImg.classList.add('hidden');
  }

  function cleanupUploadSession(sessionId){
    // 照片都已經讀進這台裝置、也用來合成了，雲端上的暫存資料就可以清掉
    if(window.forusDB) window.forusDB.ref('sessions/' + sessionId).remove().catch(()=>{});
    if(window.forusStorage){
      window.forusStorage.ref('sessions/' + sessionId).listAll()
        .then(res => res.items.forEach(item => item.delete().catch(()=>{})))
        .catch(()=>{});
    }
  }

  function loadImageFromUrl(url){
    return new Promise((resolve, reject)=>{
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.onload = ()=> resolve(img);
      img.onerror = ()=> reject(new Error('照片載入失敗'));
      img.src = url;
    });
  }

  async function handleUploadedPhotos(urls, needed, sessionId){
    if(loadingUploadedPhotos) return;
    if(urls.length < needed) return;
    if(!uploadSession || uploadSession.id !== sessionId) return; // 場次已切換，忽略舊資料
    loadingUploadedPhotos = true;
    try{
      capturedImages = [];
      thumbsRow.innerHTML = '';
      for(const url of urls.slice(0, needed)){
        const img = await loadImageFromUrl(url);
        capturedImages.push(img);
        addThumb(img.src);
        updateShotDots();
      }
      uploadQrStatus.textContent = '上傳完成！正在產生拍貼…';
      const finishedSessionId = sessionId;
      if(uploadSession && uploadSession.ref) uploadSession.ref.off();
      uploadSession = null;
      setTimeout(()=>{
        uploadQrPanel.classList.add('hidden');
        cleanupUploadSession(finishedSessionId);
        finishCapture();
      }, 500);
    }catch(err){
      uploadQrStatus.textContent = '讀取照片失敗，請粉絲重新上傳：' + err.message;
    }finally{
      loadingUploadedPhotos = false;
    }
  }

  function startPhoneUploadFlow(){
    if(!window.forusDB || !window.forusStorage){
      camStatus.textContent = 'Firebase 尚未初始化，無法使用手機上傳';
      return;
    }
    const needed = shotsNeeded();
    const sessionId = randomSessionId();
    const url = buildMobileUploadUrl(sessionId, needed);

    uploadQrPanel.classList.remove('hidden');
    uploadQrImg.classList.remove('hidden');
    uploadQrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(url)}`;
    uploadQrStatus.textContent = `請用手機掃描 QR Code 上傳照片（0 / ${needed}）`;

    const sessionRef = window.forusDB.ref('sessions/' + sessionId + '/photos');
    uploadSession = { id: sessionId, ref: sessionRef };

    sessionRef.on('value', (snapshot)=>{
      const data = snapshot.val() || {};
      const urls = Object.keys(data).sort((a,b)=>Number(a)-Number(b)).map(k=>data[k]);
      if(!uploadSession || uploadSession.id !== sessionId) return;
      uploadQrStatus.textContent = `請用手機掃描 QR Code 上傳照片（${Math.min(urls.length, needed)} / ${needed}）`;
      handleUploadedPhotos(urls, needed, sessionId);
    });
  }

  uploadQrCancelBtn.addEventListener('click', ()=>{
    cancelPhoneUpload();
  });

  captureBtn.addEventListener('click', ()=>{
    if(selectedSource === 'upload'){
      startPhoneUploadFlow();
      return;
    }
    if(!stream){
      startCamera();
      return;
    }
    runCaptureSequence();
  });

  function updateShotDots(){
    const needed = shotsNeeded();
    if(shotIndicator.children.length !== needed){
      shotIndicator.innerHTML = '';
      for(let i=0;i<needed;i++){
        const d = document.createElement('div');
        d.className = 'shot-dot';
        shotIndicator.appendChild(d);
      }
    }
    const dots = shotIndicator.querySelectorAll('.shot-dot');
    dots.forEach((d,i)=> d.classList.toggle('done', i < capturedImages.length));
  }

  function addThumb(src){
    const t = document.createElement('div');
    t.className = 'thumb';
    t.style.backgroundImage = `url(${src})`;
    thumbsRow.appendChild(t);
  }

  function countdownStep(n){
    return new Promise(resolve=>{
      countdownOverlay.innerHTML = `<div class="countdown-num">${n}</div>`;
      setTimeout(()=>{
        countdownOverlay.innerHTML = '';
        resolve();
      }, 700);
    });
  }

  function snapPhoto(){
    return new Promise(resolve=>{
      flash.classList.add('flash');
      const off = document.createElement('canvas');
      off.width = video.videoWidth;
      off.height = video.videoHeight;
      const ctx = off.getContext('2d');
      ctx.translate(off.width,0);
      ctx.scale(-1,1);
      ctx.drawImage(video, 0, 0, off.width, off.height);
      const img = new Image();
      img.onload = ()=>{
        capturedImages.push(img);
        addThumb(img.src);
        updateShotDots();
        setTimeout(()=>flash.classList.remove('flash'), 350);
        resolve();
      };
      img.src = off.toDataURL('image/png');
    });
  }

  async function runCaptureSequence(){
    captureBtn.disabled = true;
    resetCapture();
    stream && (captureBtn.disabled = true);
    const total = shotsNeeded();
    camStatus.textContent = '準備拍第 1 張';
    for(let shot=0; shot<total; shot++){
      camStatus.textContent = total === 1 ? '準備' : `第 ${shot+1} 張，準備`;
      await countdownStep(3);
      await countdownStep(2);
      await countdownStep(1);
      await snapPhoto();
      camStatus.textContent = `已拍 ${shot+1} / ${total} 張`;
      await new Promise(r=>setTimeout(r,300));
    }
    finishCapture();
  }

  function finishCapture(){
    composeResult();
    screenCapture.classList.add('hidden');
    screenResult.classList.remove('hidden');
    appEl.classList.remove('stage-capture');
  }

  retakeBtn.addEventListener('click', ()=>{
    confirmPanel.classList.remove('hidden');
  });

  cancelRetakeBtn.addEventListener('click', ()=>{
    confirmPanel.classList.add('hidden');
  });

  confirmRetakeBtn.addEventListener('click', ()=>{
    confirmPanel.classList.add('hidden');
    screenResult.classList.add('hidden');
    screenCapture.classList.remove('hidden');
    appEl.classList.add('stage-capture');
    qrPanel.classList.add('hidden');
    deleteCurrentPhotoNow();
    resetCapture();
  });

  downloadBtn.addEventListener('click', ()=>{
    const link = document.createElement('a');
    link.download = `生咖拍貼_${Date.now()}.png`;
    link.href = resultCanvas.toDataURL('image/png');
    link.click();
  });

  // ---- 手機掃描 QR Code 下載 ----
  // 現場只有一台平板/電腦在拍，粉絲要把照片存到「自己的手機」，
  // 沒有後端伺服器的情況下，唯一可行的作法是：先把合成好的照片上傳到雲端，
  // 拿到一個網址，再把網址做成 QR Code 給粉絲掃描開啟、下載。
  //
  // 這裡改用 Firebase Storage 上傳（設定已寫在 <head> 前面的 firebaseConfig）。
  // 重要：Firebase Storage 預設規則會擋掉未登入的上傳，請到
  // Firebase Console → Storage → Rules，暫時開放讀寫（僅適用於活動現場短期使用）：
  //   rules_version = '2';
  //   service firebase.storage {
  //     match /b/{bucket}/o {
  //       match /{allPaths=**} {
  //         allow read, write: if true;
  //       }
  //     }
  //   }
  //
  // ---- 上傳後自動刪除 ----
  // 目的：掃碼下載完就不要一直留在雲端。做法是：
  //   1. 使用者按「關閉」時，延遲一小段時間（讓手機那邊有機會把圖片存下來/載入完成）再刪除。
  //   2. 萬一忘記按關閉（例如直接走掉），設定一個保險用的計時器，過一段時間也會自動刪除。
  //   3. 按「確定重新拍」時，代表這張已經不需要了，直接刪除。
  // 注意：這是瀏覽器端的計時器，前提是這個網頁分頁要一直開著；如果分頁被關掉，
  // 計時器就不會執行。想要更保險（分頁關掉也會清掉），可以另外到 Google Cloud Console
  // → Cloud Storage → 選到 Firebase 用的 bucket → Lifecycle，設定一條規則，
  // 例如「物件建立超過 1 天就自動刪除」，當作最後一道防線。
  let currentPhotoRef = null;
  let autoDeleteTimer = null;
  const AUTO_DELETE_MS = 10 * 60 * 1000; // 保險用：10 分鐘後自動刪除
  const CLOSE_DELETE_DELAY_MS = 30 * 1000; // 按「關閉」後，多等 30 秒再刪除

  function scheduleAutoDelete(ref, delayMs){
    if(autoDeleteTimer) clearTimeout(autoDeleteTimer);
    autoDeleteTimer = setTimeout(()=>{
      ref.delete().catch(()=>{});
      if(currentPhotoRef === ref) currentPhotoRef = null;
      autoDeleteTimer = null;
    }, delayMs);
  }

  function deleteCurrentPhotoNow(){
    if(autoDeleteTimer){ clearTimeout(autoDeleteTimer); autoDeleteTimer = null; }
    if(currentPhotoRef){
      currentPhotoRef.delete().catch(()=>{});
      currentPhotoRef = null;
    }
  }

  qrBtn.addEventListener('click', async ()=>{
    qrPanel.classList.remove('hidden');
    qrImg.classList.add('hidden');
    qrStatus.textContent = '上傳中，請稍候…';
    try{
      if(!window.forusStorage){
        throw new Error('Firebase 尚未初始化，請確認 SDK 有正確載入');
      }
      const blob = await new Promise(resolve => resultCanvas.toBlob(resolve, 'image/png'));
      const filename = `photos/${Date.now()}_${Math.random().toString(36).slice(2,8)}.png`;
      const storageRef = window.forusStorage.ref().child(filename);
      await storageRef.put(blob, { contentType: 'image/png' });
      const url = await storageRef.getDownloadURL();
      currentPhotoRef = storageRef;
      scheduleAutoDelete(storageRef, AUTO_DELETE_MS);
      qrImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=320x320&data=${encodeURIComponent(url)}`;
      qrImg.classList.remove('hidden');
      qrStatus.textContent = '掃描後，長按照片即可存到手機相簿';
    }catch(err){
      qrStatus.textContent = '無法產生 QR Code：' + err.message;
    }
  });

  qrCloseBtn.addEventListener('click', ()=>{
    qrPanel.classList.add('hidden');
    if(currentPhotoRef){
      scheduleAutoDelete(currentPhotoRef, CLOSE_DELETE_DELAY_MS);
    }
  });

  // ---- Compositing ----
  function coverDraw(ctx, img, x, y, w, h){
    const ir = img.width / img.height;
    const r = w / h;
    let sx, sy, sw, sh;
    if(ir > r){
      sh = img.height; sw = sh * r;
      sx = (img.width - sw) / 2; sy = 0;
    } else {
      sw = img.width; sh = sw / r;
      sx = 0; sy = (img.height - sh) / 2;
    }
    ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
  }

  function roundRectPath(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  function drawDrip(ctx, x, y, s, color){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = s*0.06;
    ctx.beginPath();
    ctx.moveTo(-s*0.5, -s*0.5);
    ctx.lineTo(s*0.5, -s*0.5);
    ctx.lineTo(0, s*0.35);
    ctx.closePath();
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(0, s*0.6, s*0.08, s*0.12, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.restore();
  }

  function drawLeaf(ctx, x, y, s, color){
    ctx.save();
    ctx.translate(x,y);
    ctx.strokeStyle = color;
    ctx.lineWidth = s*0.05;
    ctx.beginPath();
    ctx.moveTo(-s*0.5, s*0.3);
    ctx.quadraticCurveTo(0, -s*0.7, s*0.5, s*0.3);
    ctx.quadraticCurveTo(0, s*0.05, -s*0.5, s*0.3);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-s*0.35, s*0.15);
    ctx.lineTo(s*0.35, s*0.15);
    ctx.stroke();
    ctx.restore();
  }

  function drawHeart(ctx, x, y, s, color){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, s*0.32);
    ctx.bezierCurveTo(-s*0.6, -s*0.25, -s*0.28, -s*0.6, 0, -s*0.18);
    ctx.bezierCurveTo(s*0.28, -s*0.6, s*0.6, -s*0.25, 0, s*0.32);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawStar(ctx, x, y, s, color){
    ctx.save();
    ctx.translate(x,y);
    ctx.fillStyle = color;
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const angle = -Math.PI/2 + i*(2*Math.PI/5);
      const angle2 = angle + Math.PI/5;
      const ox = Math.cos(angle)*s*0.5, oy = Math.sin(angle)*s*0.5;
      const ix = Math.cos(angle2)*s*0.2, iy = Math.sin(angle2)*s*0.2;
      if(i===0) ctx.moveTo(ox, oy); else ctx.lineTo(ox, oy);
      ctx.lineTo(ix, iy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function composeResult(){
    const ctx = resultCanvas.getContext('2d');

    const shopName = (shopNameInput.value || '生咖 Café').trim();
    const displayName = selectedTheme === 'layover' ? 'LAYOVER' : shopName;
    const dateStr = new Date().toLocaleDateString('zh-TW', {year:'numeric', month:'2-digit', day:'2-digit'});
    const timeStr = new Date().toLocaleTimeString('zh-TW', {hour:'2-digit', minute:'2-digit', hour12:false});

    const themes = {
      drip:{ bg:'#F0E6D2', line:'#3A2A1E', text:'#3A2A1E', sub:'rgba(58,42,30,0.55)', cellBorder:'#3A2A1E', dashed:false, mono:false, footerBg:'#F7F1E4' },
      forest:{ bg:'#DCE3D0', line:'#6B7A52', text:'#41492F', sub:'rgba(65,73,47,0.6)', cellBorder:'#6B7A52', dashed:true, mono:false, footerBg:'#E7EBDD' },
      retro:{ bg:'#241A12', line:'#C08A2E', text:'#F0E6D2', sub:'rgba(240,230,210,0.55)', cellBorder:'#4A3222', dashed:false, mono:true, footerBg:'#1B140E' },
      layover:{ bg:'#A98BD9', line:'#7B57B0', text:'#FFFFFF', sub:'rgba(255,255,255,0.75)', cellBorder:'#A98BD9', dashed:false, mono:false, footerBg:'#A98BD9' },
      taetae:{ bg:'#FBE4E4', line:'#C2555A', text:'#7A2E32', sub:'rgba(122,46,50,0.55)', cellBorder:'#C2555A', dashed:false, mono:false, footerBg:'#FBEAEA' },
      tantan:{ bg:'#DCEFFC', line:'#3E7CA6', text:'#20415A', sub:'rgba(32,65,90,0.55)', cellBorder:'#3E7CA6', dashed:true, mono:false, footerBg:'#E9F5FD' }
    };
    const t = themes[selectedTheme];
    const themeLabel = { drip:'花樣年華', forest:'SWIM', retro:'2.0', layover:'LAYOVER', taetae:'TAETAE', tantan:'TANTAN' }[selectedTheme];

    let W, H, pad, cells, footerY, footerH, headerY = 0, headerH = 0;

    if(selectedLayout === 'a4poster'){
      // 直條四連拍：仿傳統拍貼機相片條，四張照片單欄直排、底部品牌落款
      W = 1000;
      pad = 45; footerH = 220;
      const gap = 22;
      const cellW = W - pad*2;
      const cellH = Math.round(cellW * 0.66);
      H = pad*2 + cellH*4 + gap*3 + footerH;
      cells = [];
      for(let i=0;i<4;i++){
        cells.push({x:pad, y:pad + i*(cellH+gap), w:cellW, h:cellH});
      }
      footerY = H - footerH;
    } else if(selectedLayout === 'single'){
      W = 1200;
      pad = 40; footerH = 260;
      const cellW = W - pad*2;
      const cellH = Math.round(cellW * 4/3);
      H = pad*2 + cellH + footerH;
      cells = [{x:pad, y:pad, w:cellW, h:cellH}];
      footerY = H - footerH;
    } else {
      // strip4x6（預設）：整張 4×6（1200×1800），四格 2×2、每格直式
      W = 1200; H = 1800;
      pad = 40; footerH = 240;
      const gap = 20;
      const cellW = (W - pad*2 - gap) / 2;
      const cellH = (H - pad*2 - gap - footerH) / 2;
      cells = [
        {x:pad,           y:pad,           w:cellW, h:cellH},
        {x:pad+cellW+gap, y:pad,           w:cellW, h:cellH},
        {x:pad,           y:pad+cellH+gap, w:cellW, h:cellH},
        {x:pad+cellW+gap, y:pad+cellH+gap, w:cellW, h:cellH}
      ];
      footerY = H - footerH;
    }

    resultCanvas.width = W;
    resultCanvas.height = H;

    // LAYOVER 主題：直接把實際相框圖檔疊上去（透明窗格露出照片，其餘含 LOGO 一次到位）
    if(selectedTheme === 'layover'){
      const layoverFrameMap = {
        strip4x6: [layoverFrameImg_strip4x6, layoverFrameReady_strip4x6],
        a4poster: [layoverFrameImg_a4poster, layoverFrameReady_a4poster],
        single:   [layoverFrameImg_single,   layoverFrameReady_single]
      };
      const pick = layoverFrameMap[selectedLayout];
      if(pick && pick[0] && pick[1]){
        ctx.fillStyle = t.bg;
        ctx.fillRect(0, 0, W, H);
        cells.forEach((c, i)=>{
          if(capturedImages[i]){
            ctx.save();
            ctx.beginPath();
            ctx.rect(c.x, c.y, c.w, c.h);
            ctx.clip();
            coverDraw(ctx, capturedImages[i], c.x, c.y, c.w, c.h);
            ctx.restore();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(c.x, c.y, c.w, c.h);
          }
        });
        ctx.drawImage(pick[0], 0, 0, W, H);
        return;
      }
    }
        // 2.0 主題：依版面尺寸疊上對應的相框圖檔
    if(selectedTheme === 'retro'){
      const retroFrameMap = {
        strip4x6: [retroFrameImg_strip4x6, retroFrameReady_strip4x6],
        a4poster: [retroFrameImg_a4poster, retroFrameReady_a4poster],
        single:   [retroFrameImg_single,   retroFrameReady_single]
      };
      const pick = retroFrameMap[selectedLayout];
      if(pick && pick[0] && pick[1]){
        ctx.fillStyle = t.bg;
        ctx.fillRect(0, 0, W, H);
        cells.forEach((c, i)=>{
          if(capturedImages[i]){
            ctx.save();
            ctx.beginPath();
            ctx.rect(c.x, c.y, c.w, c.h);
            ctx.clip();
            coverDraw(ctx, capturedImages[i], c.x, c.y, c.w, c.h);
            ctx.restore();
          } else {
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(c.x, c.y, c.w, c.h);
          }
        });
        ctx.drawImage(pick[0], 0, 0, W, H);
        return;
      }
    }

    // background
    ctx.fillStyle = t.bg;
    ctx.fillRect(0,0,W,H);

    // 主題裝飾
    const isz = W*0.0875;
    if(selectedTheme === 'drip') drawDrip(ctx, W-isz, isz*0.96, isz, t.line);
    else if(selectedTheme === 'forest') drawLeaf(ctx, W-isz, isz*0.96, isz*1.07, t.line);
    else if(selectedTheme === 'retro'){
      const holeR = W*0.011;
      for(let yy = pad; yy < footerY; yy += W*0.055){
        ctx.beginPath(); ctx.arc(pad*0.35, yy, holeR, 0, Math.PI*2); ctx.fillStyle='#F0E6D2'; ctx.globalAlpha=0.15; ctx.fill();
        ctx.beginPath(); ctx.arc(W-pad*0.35, yy, holeR, 0, Math.PI*2); ctx.fill();
        ctx.globalAlpha=1;
      }
    }
    else if(selectedTheme === 'taetae') drawHeart(ctx, W-isz, isz*0.96, isz*1.1, t.line);
    else if(selectedTheme === 'tantan') drawStar(ctx, W-isz, isz*0.96, isz*1.1, t.line);

    // photo cells
    const cellRadius = selectedTheme === 'layover' ? Math.max(3, Math.round(W*0.004)) : Math.max(6, Math.round(W*0.012));
    cells.forEach((c, i)=>{
      ctx.save();
      roundRectPath(ctx, c.x, c.y, c.w, c.h, cellRadius);
      ctx.clip();
      if(capturedImages[i]){
        coverDraw(ctx, capturedImages[i], c.x, c.y, c.w, c.h);
        if(selectedTheme === 'retro'){
          ctx.fillStyle = 'rgba(36,26,18,0.18)';
          ctx.fillRect(c.x, c.y, c.w, c.h);
        }
      } else {
        ctx.fillStyle = '#d8cba8';
        ctx.fillRect(c.x, c.y, c.w, c.h);
      }
      ctx.restore();
      ctx.save();
      roundRectPath(ctx, c.x, c.y, c.w, c.h, cellRadius);
      ctx.lineWidth = Math.max(2, Math.round(W*0.0025));
      ctx.strokeStyle = t.cellBorder;
      if(t.dashed) ctx.setLineDash([W*0.008, W*0.0065]);
      ctx.stroke();
      ctx.restore();
    });

    // footer
    ctx.fillStyle = t.footerBg;
    ctx.fillRect(0, footerY, W, footerH);
    ctx.strokeStyle = t.line;
    ctx.globalAlpha = 0.4;
    ctx.beginPath();
    ctx.moveTo(pad, footerY);
    ctx.lineTo(W-pad, footerY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.fillStyle = t.text;
    ctx.textBaseline = 'alphabetic';
    ctx.font = "700 " + Math.round(W*0.047) + "px 'Noto Serif TC', serif";
    ctx.fillText(displayName, pad, footerY + footerH*0.42);

    ctx.fillStyle = t.sub;
    ctx.font = "400 " + Math.round(W*0.025) + "px 'Noto Sans TC', sans-serif";
    const stamp = selectedTheme === 'retro' ? `${dateStr}  ${timeStr}` : `${dateStr}`;
    ctx.fillText(stamp, pad, footerY + footerH*0.68);

    if(selectedTheme !== 'layover'){
      ctx.textAlign = 'right';
      ctx.fillText(themeLabel, W - pad, footerY + footerH*0.68);
      ctx.textAlign = 'left';
    }
  }

  // ensure canvas has something drawn even before capture (placeholder preview)
  applyViewfinderAspect();
  composeResult();
})();
</script>
